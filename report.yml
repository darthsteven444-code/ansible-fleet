# read only. what does every box look like right now.
- name: fleet report
  hosts: linux
  become: true
  gather_facts: true
  tasks:
    - name: refresh package lists
      ansible.builtin.shell: apt-get update -qq
      changed_when: false
      check_mode: false

    - name: count pending updates
      ansible.builtin.shell: apt list --upgradable 2>/dev/null | grep -c upgradable || true
      register: pending
      changed_when: false
      check_mode: false

    - name: count pending security updates
      ansible.builtin.shell: apt list --upgradable 2>/dev/null | grep -c -- -security || true
      register: security
      changed_when: false
      check_mode: false

    - name: reboot already waiting?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: rr

    - name: summary
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} | kernel {{ ansible_kernel }} | up {{ (ansible_uptime_seconds / 86400) | round(1) }} days | {{ pending.stdout }} updates ({{ security.stdout }} security) | reboot waiting: {{ rr.stat.exists }}"

- name: cluster state
  hosts: control
  gather_facts: false
  tasks:
    - name: nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes
      changed_when: false
      check_mode: false

    - name: show nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
