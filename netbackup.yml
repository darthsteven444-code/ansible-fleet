---
# netbackup.yml: pulls the running config of every network device into a private git repo.
# Cisco gear over SSH with enable, OPNsense over a key that is only allowed to read config.xml.
# Inventory and credentials live outside this repo (see run-backup.sh), nothing secret is committed here.
- name: Cisco running configs
  hosts: ios
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_network_cli_ssh_type: paramiko
    ansible_user: "{{ lookup('ansible.builtin.env', 'IOS_USER') }}"
    ansible_password: "{{ lookup('ansible.builtin.env', 'IOS_PASS') }}"
    ansible_become: true
    ansible_become_method: ansible.netcommon.enable
    ansible_become_password: "{{ lookup('ansible.builtin.env', 'IOS_ENABLE') }}"
    backup_dir: "{{ lookup('ansible.builtin.env', 'BACKUP_DIR') }}"
  tasks:
    - name: Read the running config
      cisco.ios.ios_command:
        commands: show running-config
      register: running

    - name: Save it, minus the lines that change on their own
      ansible.builtin.copy:
        content: "{{ running.stdout[0] | regex_replace('(?m)^(! Last configuration change|! NVRAM config last updated|ntp clock-period|Building configuration).*\\n?', '') }}\n"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}.cfg"
        mode: "0600"
      delegate_to: localhost

- name: OPNsense config.xml
  hosts: opnsense
  gather_facts: false
  connection: local
  vars:
    backup_dir: "{{ lookup('ansible.builtin.env', 'BACKUP_DIR') }}"
  tasks:
    - name: Read config.xml over the read only key
      ansible.builtin.command:
        argv: [ssh, -i, "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/netbackup_ed25519", -o, BatchMode=yes, -o, ConnectTimeout=10,
               -o, StrictHostKeyChecking=accept-new, "root@{{ ansible_host }}"]
      register: cfg
      changed_when: false
      no_log: true

    - name: Fail if it does not look like a config
      ansible.builtin.assert:
        that: "'</opnsense>' in cfg.stdout"
        quiet: true

    - name: Save it
      ansible.builtin.copy:
        content: "{{ cfg.stdout }}\n"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}.xml"
        mode: "0600"
      no_log: true
