---
# netbackup.yml: pulls the running config of every network device into a private git repo.
# Cisco gear through OpenSSH (ios-pull.sh, these IOS versions only speak the old SHA1 key exchange),
# OPNsense over a key that is only allowed to read config.xml.
# Inventory and credentials live outside this repo, nothing secret is committed here.
- name: Cisco running configs
  hosts: ios
  gather_facts: false
  connection: local
  vars:
    backup_dir: "{{ lookup('ansible.builtin.env', 'BACKUP_DIR') }}"
  tasks:
    - name: Pull the running config
      ansible.builtin.command:
        argv:
          - "{{ lookup('ansible.builtin.env', 'HOME') }}/.net-backup/ios-pull.sh"
          - "{{ ansible_host }}"
          - "{{ backup_dir }}/{{ inventory_hostname }}.cfg"
      environment:
        IOS_BECOME: "{{ 'yes' if (ios_become | default(true) | bool) else 'no' }}"
      changed_when: false

- name: OPNsense config.xml
  hosts: opnsense
  gather_facts: false
  connection: local
  vars:
    backup_dir: "{{ lookup('ansible.builtin.env', 'BACKUP_DIR') }}"
  tasks:
    - name: Read config.xml over the read only key
      ansible.builtin.command:
        argv: [ssh, -i, "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/netbackup_ed25519", -o, BatchMode=yes, -o, ConnectTimeout=10,
               -o, StrictHostKeyChecking=accept-new, "root@{{ ansible_host }}"]
      register: cfg
      changed_when: false
      no_log: true

    - name: Fail if it does not look like a config
      ansible.builtin.assert:
        that: "'</opnsense>' in cfg.stdout"
        quiet: true

    - name: Save it
      ansible.builtin.copy:
        content: "{{ cfg.stdout }}\n"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}.xml"
        mode: "0600"
      no_log: true
